<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>HEDS Academy Blog</title>
  <style>
    :root {
      --navy: #0a1f44;
      --gold: #f2a900;
      --white: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--navy);
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin:  0;
      padding: 40px 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 { color: var(--gold); font-size: 2rem; margin-bottom: 8px; }
    h2 { color: var(--white); font-size: 1.25rem; margin-bottom: 4px; }
    a { color: var(--gold); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .back-link { margin-bottom: 32px; display: inline-block; }
    .post { padding: 24px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .post:last-child { border-bottom: none; }
    .post-meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 8px; }
    .post-summary { color: var(--muted); line-height: 1.6; }
    .empty { color: var(--muted); text-align: center; padding: 60px 0; font-size: 1.1rem; }
  </style>
</head>
<body>
  <a class="back-link" href="../">&larr; Back to HEDS Academy</a>
  <h1>HEDS Academy Blog</h1>
  <p style="color:var(--muted);margin-bottom:32px;">Operating discipline insights for heavy equipment dealers and rental companies.</p>

  <div class="empty">
    <p>Articles coming soon.</p>
    <p style="font-size:0.9rem;margin-top:8px;">Weekly posts start October 2026.</p>
  </div>
</body>
</html>
